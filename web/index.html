<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gemma 4 ローカルサーバー</title>
<style>body{max-width:720px;margin:64px auto;padding:0 24px;font:18px/1.8 system-ui;color:#243047;background:#f5f7fb}code{background:#e4eaf2;padding:4px 8px;border-radius:6px}a{color:#245bb8}</style>
<h1>Gemma 4 ローカルサーバー</h1>
<p id="status">状態を確認しています…</p>
<p>ターミナルで <code>python3.10 chat.py</code> を実行してチャットできます。</p>
<p>既定のsystem prompt は <code>system2.txt</code> を編集して設定します。</p>
<p>別のファイルを使う場合：<br><code>python3.10 chat.py --system-file system1.txt</code></p>
<p><a href="/health">サーバー状態（JSON）</a> · <a href="/v1/models">モデル情報（JSON）</a></p>
<script>
fetch('/health').then(async r=>{document.getElementById('status').textContent=r.ok?'サーバーは稼働中です。':'モデルの準備中です。しばらくして再読み込みしてください。';}).catch(()=>{document.getElementById('status').textContent='サーバーに接続できません。';});
</script>
</html>
